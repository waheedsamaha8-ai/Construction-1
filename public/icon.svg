
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" /> <!-- Amber 300 -->
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" /> <!-- Amber 600 -->
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Helmet Icon Group -->
  <g transform="translate(86, 106) scale(0.66)" filter="url(#shadow)">
    <!-- Main Dome -->
    <path d="M256 32 C 141.1 32 48 125.1 48 240 v 80 h 416 v -80 c 0 -114.9 -93.1 -208 -208 -208 Z" fill="#0f172a" />
    
    <!-- Rim -->
    <path d="M16 320 h 480 c 17.7 0 32 14.3 32 32 s -14.3 32 -32 32 H 16 c -17.7 0 -32 -14.3 -32 -32 s 14.3 -32 32 -32 Z" fill="#0f172a" />
    
    <!-- Crest/Badge Mount -->
    <rect x="224" y="64" width="64" height="160" rx="16" fill="#1e293b" />
    
    <!-- Side Details -->
    <path d="M128 160 v 120" stroke="#1e293b" stroke-width="20" stroke-linecap="round" opacity="0.4"/>
    <path d="M384 160 v 120" stroke="#1e293b" stroke-width="20" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Highlight Reflection -->
    <path d="M180 100 Q 256 60 332 100" stroke="#334155" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>
